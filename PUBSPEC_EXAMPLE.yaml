# 다른 Flutter 앱에서 ars_login 패키지를 사용할 때의 pubspec.yaml 예시

name: your_app_name
description: A new Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 필수! ars_login 패키지가 의존하는 상태관리 라이브러리
  flutter_riverpod: ^2.6.1
  
  # ✅ 옵션 1: 수정된 브랜치 사용 (현재 권장)
  ars_login:
    git:
      url: https://github.com/okpojung/ars_auth.git
      ref: genspark_ai_developer
  
  # ✅ 옵션 2: PR 머지 후 main 브랜치 사용
  # ars_login:
  #   git:
  #     url: https://github.com/okpojung/ars_auth.git
  #     ref: main
  
  # ✅ 옵션 3: 특정 커밋 고정
  # ars_login:
  #   git:
  #     url: https://github.com/okpojung/ars_auth.git
  #     ref: 997feb5
  
  # 기타 필요한 패키지들
  # cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # assets:
  #   - images/

# =====================================
# Git 의존성 설명
# =====================================
#
# url: Git 저장소 URL (필수)
#   - GitHub 저장소의 HTTPS URL
#   - 예: https://github.com/username/repository.git
#
# ref: 브랜치, 태그, 또는 커밋 해시 (선택)
#   - 브랜치: main, develop, feature/xxx
#   - 태그: v1.0.0, v2.1.3
#   - 커밋: 997feb5 (전체 해시도 가능)
#   - 생략 시: 기본 브랜치 (보통 main)
#
# path: 저장소 내 하위 경로 (선택)
#   - 모노레포에서 패키지가 하위 폴더에 있을 때
#   - 예: path: packages/ars_login
#
# =====================================
