name: ars_login
description: "ars2fa 발신 ARS 휴대폰 인증 Flutter SDK. 앱이 인증용 0507 번호로 바로 전화를 걸고(번호 비표시) 통신사 기록으로 확인된 휴대폰 번호를 돌려받습니다."
version: 2.1.0
homepage: https://ars2fa.baro.me
repository: https://github.com/okpojung/ars_auth
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.2.1
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
