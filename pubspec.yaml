name: ars_login
description: "한국의 ARS(자동응답시스템) 인증을 위한 Flutter 패키지. 전화 인증, 약관 동의, 권한 관리 등 통합 인증 솔루션 제공."
version: 1.1.0
homepage: https://github.com/your-username/ars_login
repository: https://github.com/your-username/ars_login
issue_tracker: https://github.com/your-username/ars_login/issues

environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 데이터 모델링
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 네트워크
  dio: ^5.7.0

  # 권한 및 디바이스
  permission_handler: ^12.0.0
  phone_state: ^1.0.3
  flutter_phone_direct_caller: ^2.2.1
  device_info_plus: ^10.1.2

  # 유틸리티
  crypto: ^3.0.5
  logger: ^2.4.0

  # UI
  lottie: ^3.2.0
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 코드 생성
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/images/
    - assets/html/
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
